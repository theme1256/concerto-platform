; Keep the complete request within Nginx's existing 50M limit.
upload_max_filesize = 48M
post_max_size = 50M
max_file_uploads = 20
max_input_vars = 1000
max_input_nesting_level = 32
; Added to PHP 7.4 by the official PHP2Shell source backport.
max_multipart_body_parts = 1020
memory_limit = 128M
session.upload_progress.enabled = 0
date.timezone = UTC
display_errors = 0
log_errors = 1
session.cookie_secure = ${CONCERTO_COOKIES_SECURE_PHP}
session.cookie_samesite = ${CONCERTO_COOKIES_SAME_SITE}
session.cookie_lifetime = ${CONCERTO_COOKIES_LIFETIME}
expose_php = 0
