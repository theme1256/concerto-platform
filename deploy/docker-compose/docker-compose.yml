version: '2'
services:
  database:
    # MySQL 8.4 LTS. Do not start it on an existing ./data/mysql from mysql:5.7: 8.4 cannot open
    # it and its start attempts damage it. Migrate as described in UPGRADE.md (5.1.0).
    image: mysql:8.4
    container_name: database
    restart: on-failure
    environment:
      - MYSQL_DATABASE=concerto
      - MYSQL_USER=concerto
      - MYSQL_PASSWORD=changeme
      - MYSQL_ROOT_PASSWORD=changeme
      - TZ=UTC
    volumes:
      - ./data/mysql:/var/lib/mysql

  concerto:
    image: campsych/concerto-platform:master
    container_name: concerto
    restart: on-failure
    volumes:
      - ./data/concerto:/data
    environment:
      - CONCERTO_PASSWORD=admin
      - CONCERTO_CONTENT_URL=.
      - CONCERTO_PLATFORM_URL=/
      - CONCERTO_GIT_REPOSITORY_PATH=/data/git
      - DB_HOST=database
      - DB_VERSION=8.4
      - DB_PASSWORD=changeme
      - TZ=UTC
    ports:
      - "80:80"
