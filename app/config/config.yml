parameters:
    version: "5.1.0"
    env(CONCERTO_OAUTH_KEY_DIR): "%kernel.project_dir%/var/oauth"
    oauth_key_dir: "%env(resolve:CONCERTO_OAUTH_KEY_DIR)%"
    available_locales:
        en_GB: english
        zh_CN: 中文
        fr_FR: français
        pl_PL: polski
        tr_TR: türkçe

imports:
    - { resource: parameters.yml }
    - { resource: security.yml } 
    - { resource: parameters_administration.yml }
    - { resource: parameters_test_runner.yml }
    - { resource: parameters_uio.yml }
    - { resource: parameters_saml.yml }

framework:
    #esi:             ~
    #translator:      { fallback: %locale% }
    secret:          "%secret%"
    router:
        resource: "%kernel.project_dir%/app/config/routing.yml"
        strict_requirements: ~
    form:            ~
    csrf_protection: ~
    validation: { enable_annotations: true }
    #serializer: { enable_annotations: true }
    default_locale:  "%locale%"
    trusted_hosts: ~
    session:
        # https://symfony.com/doc/current/reference/configuration/framework.html#handler-id
        handler_id: session.handler.native_file
        save_path: '%env(CONCERTO_PHP_SESSION_SAVE_PATH)%'
        cookie_samesite: 'strict'
    fragments:       ~
    http_method_override: true
    assets: ~
    php_errors:
        log: true
    translator: 
        fallback: en_GB

sensio_framework_extra:
    router:
        annotations: false

# Twig Configuration
twig:
    default_path:     "%kernel.project_dir%/app/Resources/views"
    exception_controller: null
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    globals:
      env: "%kernel.environment%"
      version: "%version%"
      available_locales: "%available_locales%"

# Doctrine Configuration
doctrine:
    dbal:
        default_connection: local
        connections:
            local:
                driver:      "%database_driver%"
                server_version: "%env(DB_VERSION)%"
                host:        "%env(DB_HOST)%"
                port:        "%env(DB_PORT)%"
                dbname:      "%env(DB_NAME)%"
                user:        "%env(DB_USER)%"
                password:    "%env(DB_PASSWORD)%"
                charset:     UTF8
                path:        "%database_path%"
                unix_socket: "%database_unix_socket%"

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"
        #naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true

# OAuth2 for the API (client_credentials). Keys are generated by concerto:setup.
league_oauth2_server:
    authorization_server:
        private_key:    "%oauth_key_dir%/private.key"
        encryption_key: "%secret%"
        access_token_ttl: PT1H
        enable_client_credentials_grant: true
        enable_password_grant: false
        enable_refresh_token_grant: false
        enable_auth_code_grant: false
    resource_server:
        public_key: "%oauth_key_dir%/public.key"
    scopes:
        available: ['api']
        default: ['api']
    persistence:
        doctrine:
            entity_manager: default
    client:
        classname: Concerto\APIBundle\Entity\Client

lexik_jwt_authentication:
    secret_key: "%env(CONCERTO_JWT_SECRET)%"
    token_ttl: "%env(CONCERTO_SESSION_TOKEN_EXPIRY_TIME)%"
    encoder:
        signature_algorithm: HS512

scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    google:
        enabled: true
        digits: 6
        window: 1
        #server_name: Server Name
        #issuer: Issuer Name
        template: "@ConcertoPanel/Panel/login_mfa.html.twig"