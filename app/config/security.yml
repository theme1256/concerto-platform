security:
    enable_authenticator_manager: true

    # Legacy salted SHA-1, unchanged so existing password hashes keep working.
    password_hashers:
        Concerto\PanelBundle\Entity\User:
          algorithm: sha1
          encode_as_base64: false
          iterations: 1

    providers:
        users:
          entity: { class: ConcertoPanelBundle:User, property: username }

    firewalls:
        admin_area:
          pattern: ^/admin
          user_checker: Concerto\PanelBundle\Security\UserChecker
          form_login:
            login_path: login
            check_path: login_check
            default_target_path: index
          logout:
            path: /admin/logout
            target: /admin
          two_factor:
            auth_form_path: 2fa_login
            check_path: 2fa_login_check

        oauth_token:
          pattern:    ^/oauth/v2/token
          security:   false

        api:
          pattern:    ^/api(/data|/runner)
          oauth2:     true
          stateless:  true

        # Token is optional here: requests without one stay unauthenticated.
        open_api:
          pattern:    ^/api(/check|/saml)
          oauth2:     true
          stateless:  true

    access_control:
        - { path: ^/admin/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: [ IS_AUTHENTICATED_FULLY ] }
        - { path: ^/api(/data|/runner), roles: [ IS_AUTHENTICATED_FULLY ] }
